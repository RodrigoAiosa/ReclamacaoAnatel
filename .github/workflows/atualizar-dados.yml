name: Atualizar dados (verificação diária)

on:
  schedule:
    - cron: "43 6 * * *"   # todo dia às 06:43 UTC (03:43 em Brasília); se o arquivo da Anatel não mudou, só registra no log
  workflow_dispatch:
  push:
    paths: [".github/workflows/atualizar-dados.yml", "scripts/etl.py"]

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - run: pip install -r requirements-etl.txt
      - name: Rodar ETL
        id: etl
        timeout-minutes: 10
        env:
          DATA_URL: ${{ vars.DATA_URL || 'https://www.anatel.gov.br/dadosabertos/paineis_de_dados/consumidor/indicadores_qualidade_atendimento.zip' }}
        run: python scripts/etl.py
      - name: Commit dos dados e do log (dispara novo deploy na Vercel)
        if: always()          # o log é gravado mesmo quando o ETL falha; os dados só se o ETL deu certo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/
          [ "${{ steps.etl.outcome }}" = "success" ] && git add data/
          git diff --cached --quiet || (git commit -m "chore(data): atualização automática [${{ steps.etl.outcome }}]" && git pull --rebase -q && git push)
          [ "${{ steps.etl.outcome }}" = "success" ]
