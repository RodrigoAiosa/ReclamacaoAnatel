name: Atualizar dados (a cada 2 dias)

on:
  schedule:
    - cron: "17 6 */2 * *"   # 06:17 UTC, dias ímpares do mês (~a cada 2 dias)
  workflow_dispatch:
  push:
    paths: [".github/workflows/atualizar-dados.yml"]

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-etl.txt
      - name: Rodar ETL
        env:
          DATA_URL: ${{ vars.DATA_URL || 'https://www.anatel.gov.br/dadosabertos/paineis_de_dados/consumidor/indicadores_qualidade_atendimento.zip' }}
        run: python scripts/etl.py
      - name: Commit se houve mudança (dispara novo deploy na Vercel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "chore(data): atualização automática" && git push)
